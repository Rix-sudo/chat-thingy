<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Prototype</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    background: #f5f5f5;
    color: #222;
  }
  h2 { text-align: center; }
  #status {
    text-align: center;
    font-size: 0.85em;
    color: #888;
    margin-bottom: 10px;
  }
  #messages {
    list-style: none;
    padding: 10px;
    margin: 0 0 10px 0;
    height: 400px;
    overflow-y: auto;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  #messages li {
    padding: 6px 10px;
    margin: 4px 0;
    background: #e9f0ff;
    border-radius: 6px;
    word-wrap: break-word;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type=text] {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #4a6cf7;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #3a5ce0; }
</style>
</head>
<body>

<h2>💬 Chat Prototype</h2>
<div id="status">Connecting...</div>
<ul id="messages"></ul>

<form id="form">
  <input id="nameInput" type="text" placeholder="Your name" style="max-width:120px;" required>
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const nameInput = document.getElementById('nameInput');
  const status = document.getElementById('status');

  // Auto-detect ws:// vs wss:// and connect to whatever host served this page
  const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  const socket = new WebSocket(protocol + window.location.host);

  socket.onopen = () => {
    status.textContent = 'Connected ✅';
  };

  socket.onclose = () => {
    status.textContent = 'Disconnected ❌';
  };

  socket.onmessage = (event) => {
    const li = document.createElement('li');
    li.textContent = event.data;
    messages.appendChild(li);
    messages.scrollTop = messages.scrollHeight;
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!input.value.trim()) return;

    const name = nameInput.value.trim() || 'Anonymous';
    const text = `${name}: ${input.value}`;
    socket.send(text);
    input.value = '';
  });
</script>

</body>
</html>
